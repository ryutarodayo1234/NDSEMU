<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>PenDS</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <!-- エミュレータ画面エリア -->
        <main class="emulator-container">
            <div class="emulator-screen-box">
                <desmond-player id="player"></desmond-player>
            </div>

            <!-- 初回ROMロード用オーバーレイ -->
            <div id="welcome-overlay" class="overlay">
                <div class="upload-zone" id="drop-zone">
                    <div class="pulse-ring"></div>
                    <div class="upload-content">
                        <h2>ROMファイルをロード</h2>
                        <p class="drop-text">ここに .nds ファイルをドラッグ＆ドロップ</p>
                        <p class="or-text">または</p>
                        <button class="btn-primary" id="btn-select-rom">ファイルを選択</button>
                        <input type="file" id="rom-input" accept=".nds" style="display: none;">
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- トースト通知 -->
    <div id="msg-layer" class="toast-message" hidden>
        <span id="msg-text"></span>
    </div>

    <script src="desmond.min.js"></script>
    <script src="app.js"></script>
</body>

</html>
